# Control-loop (process-control-loop, PCL) grouping of the 78 HAI 21.03 tags.
# Source: HAI technical details (v4, Tables "HAI data points" and "Attack scenarios",
# controllers P1-PC/LC/FC/TC, P2-SC, P2-TC, P3-LC; HIL models STM/HTM).
# Assignments marked (J) are our engineering judgement where the documentation does
# not state the loop membership explicitly; they are fixed BEFORE looking at test data.
P1-PC: [P1_B2004, P1_B2016, P1_PIT01, P1_PIT02, P1_PCV01D, P1_PCV01Z, P1_PCV02D, P1_PCV02Z]   # PIT02, PCV02 (J)
P1-LC: [P1_B3004, P1_LIT01, P1_LCV01D, P1_LCV01Z, P1_FT01, P1_FT01Z]                          # FT01 inflow (J)
P1-FC: [P1_B3005, P1_FT03, P1_FT03Z, P1_FCV03D, P1_FCV03Z]
P1-TC: [P1_B4002, P1_B4005, P1_B400B, P1_B4022, P1_FCV01D, P1_FCV01Z, P1_FCV02D, P1_FCV02Z, P1_FT02, P1_FT02Z, P1_TIT01, P1_TIT02]  # FCV02, FT02, B400B (J)
P1-AUX: [P1_PP01AD, P1_PP01AR, P1_PP01BD, P1_PP01BR, P1_PP02D, P1_PP02R, P1_STSP]
P2-SC: [P2_ASD, P2_MSD, P2_CO_rpm, P2_SIT01, P2_SIT02, P2_HILout, P2_AutoGO, P2_ManualGO, P2_OnOff, P2_24Vdc]  # HILout, 24Vdc (J)
P2-TC: [P2_RTR, P2_VTR01, P2_VTR02, P2_VTR03, P2_VTR04, P2_VT01, P2_VXT02, P2_VXT03, P2_VYT02, P2_VYT03, P2_TripEx, P2_Emerg]
P3-LC: [P3_FIT01, P3_LCP01D, P3_LCV01D, P3_LH, P3_LIT01, P3_LL, P3_PIT01]
P4-ST: [P4_ST_FD, P4_ST_GOV, P4_ST_LD, P4_ST_PO, P4_ST_PS, P4_ST_PT01, P4_ST_TT01, P4_LD]
P4-HT: [P4_HT_FD, P4_HT_LD, P4_HT_PO, P4_HT_PS]
